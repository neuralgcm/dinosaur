name: CI

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run unit tests
  pytest-job:
    name: "python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - name: Cancel previous
      uses: styfle/cancel-workflow-action@d7e57e26a6f753933f8ef746a37097a61375236b # 0.7.0
      with:
        access_token: ${{ github.token }}
      if: ${{github.ref != 'refs/head/main'}}
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install Dinosaur
      run: |
        pip install -e .[tests]
    - name: Run unit tests
      # TODO(shoyer): re-enable regrid_test once we figure out how to install Beam on GitHub actions
      run: |
        pytest -v dinosaur --ignore=dinosaur/pipelines

  # Auto-publish when version is increased
  publish-job:
    # Only try to publish if:
    # * Repo is self (prevents running from forks)
    # * Branch is `main`
    if: |
      github.repository == 'neuralgcm/dinosaur'
      && github.ref == 'refs/heads/main'
    needs: pytest-job  # Only publish after tests are successful
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Check version and build if new
      id: check_version
      run: |
        python -m pip install --upgrade pip build twine packaging
        python -m build
        LOCAL_VER=$(python -c "import glob, os; whl=glob.glob('dist/*.whl')[0]; print(os.path.basename(whl).split('-')[1])")
        PYPI_VER=$(python -c "import json, urllib.request; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/dinosaur/json').read())['info']['version'])")
        echo "Local: $LOCAL_VER, PyPI: $PYPI_VER"
        if python -c "from packaging.version import Version; exit(0 if Version('$LOCAL_VER') > Version('$PYPI_VER') else 1)"; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: Clean up failed staging attempt for this exact version (if any)
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        python3 - <<'PY'
        import email, glob, re, subprocess, tarfile, zipfile
        seen = set()
        for f in sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True)):
          try:
            if f.endswith(".whl"):
              with zipfile.ZipFile(f) as zf:
                meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                msg = email.message_from_bytes(zf.read(meta))
            else:
              with tarfile.open(f) as tf:
                info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                msg = email.message_from_bytes(tf.extractfile(info).read())
            pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
            ver = msg["Version"].strip()
          except Exception:
            continue
          if (pkg, ver) in seen:
            continue
          seen.add((pkg, ver))
          if subprocess.run([
              "gcloud", "artifacts", "versions", "describe", ver,
              f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=dinosaur--pypi"
          ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
            subprocess.run([
                "gcloud", "artifacts", "versions", "delete", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=dinosaur--pypi", "--quiet"
            ], check=False)
        PY
    - name: Stage distributions to OSS Exit Gate and upload manifest
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        python -m pip install --upgrade twine
        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        echo "::add-mask::${TWINE_PASSWORD}"
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/dinosaur--pypi/" \
          -u oauth2accesstoken \
          -p "${TWINE_PASSWORD}" \
          dist/*
        python3 - dist/* <<'PY'
        import email, json, re, sys, tarfile, zipfile
        pairs = set()
        for path in sys.argv[1:]:
          if path.endswith(".whl"):
            with zipfile.ZipFile(path) as zf:
              for name in zf.namelist():
                if name.endswith(".dist-info/METADATA"):
                  msg = email.message_from_bytes(zf.read(name))
                  pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                  pairs.add((pkg, msg["Version"].strip()))
                  break
          elif path.endswith(".tar.gz"):
            with tarfile.open(path, "r:gz") as tf:
              for member in tf.getmembers():
                if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1:
                  f = tf.extractfile(member)
                  if f is not None:
                    msg = email.message_from_bytes(f.read())
                    pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                    pairs.add((pkg, msg["Version"].strip()))
                  break
        if not pairs:
          raise SystemExit("ERROR: No .whl/.tar.gz package metadata found for manifest.json")
        manifest = {
            "publish_all": False,
            "publishing_groups": [{
                "packages": [{"name": pkg, "version": ver} for pkg, ver in sorted(pairs)]
            }],
        }
        with open("manifest.json", "w", encoding="utf-8") as fh:
          json.dump(manifest, fh, indent=2)
          fh.write("\n")
        PY
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/dinosaur/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
